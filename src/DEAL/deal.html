<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal Management System</title>
    <link rel="stylesheet" href="/DEAL/deal.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<div class="app-container">
        <!-- Header Navigation -->
        <nav class="header">
            <div class="header-content">
                <div class="header-left">
                    <div class="logo">
                        <img src="../Asset/Globentix_logo.png" alt="Globentix Logo">
                    </div>
                    <nav class="main-nav">
                        <a href="/dashboard" class="nav-link" data-page="dashboard">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                        <a href="/leads" class="nav-link" data-page="leads">
                            <i class="fas fa-user-plus"></i> Show Leads
                        </a>
                        <a href="/industry-leads" class="nav-link" data-page="industry-leads">
                            <i class="fa-solid fa-headset"></i> Industry Leads
                        </a>
                        <a href="/deals" class="nav-link active" data-page="deals">
                            <i class="fas fa-handshake"></i> Deals
                        </a>
                        <a href="/contacts" class="nav-link" data-page="contacts">
                            <i class="fas fa-address-book"></i> Contacts
                        </a>
                        <a href="/invoice" class="nav-link" data-page="invoice">
                            <i class="fas fa-file-invoice"></i> Invoice 
                        </a>
                        <!-- <a href="/reports" class="nav-link" data-page="reports">
                            <i class="fas fa-chart-bar"></i> Reports
                        </a> -->
                        <a href="/settings" class="nav-link" data-page="settings">
                            <i class="fas fa-cog"></i> Settings
                        </a>
                        <a href="/salary" class="nav-link" data-page="salary">
                            <i class="fas fa-money-bill"></i> Salary
                        </a>
                    </nav>
                </div>
                <div class="header-right">
                    <!-- <div class="notifications" onclick="toggleNotifications()">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="notificationCount">5</span> Notification
                    </div> -->
                    
                    <div class="user-profile" onclick="toggleUserMenu()">
                        <img src="/assets/Logo.png" alt="User" class="user-avatar">
                        <span class="user-name">John Doe</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            </div>
        </nav>
   <div class="main-layout">

        <!-- Search & Filters Box -->
        <div class="deals-searchbox">
            <div class="list-header">
                <div class="list-controls">
                    <select class="filter-select" id="stageFilter" onchange="filterDeals()">
                        <option value="">All Stages</option>
                        <option value="Prospecting">Prospecting</option>
                        <option value="Qualification">Qualification</option>
                        <option value="Proposal">Proposal</option>
                        <option value="Negotiation">Negotiation</option>
                        <option value="Won">Won</option>
                        <option value="Lost">Lost</option>
                    </select>
                    <select class="filter-select" id="priorityFilter" onchange="filterDeals()">
                        <option value="">All Priorities</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                    <div class="search-container">
                        <i class="fas fa-search search-icon"></i>
                        <input type="search" class="search-input" placeholder="Search deals..." onkeyup="searchDeals(this.value)">
                    </div>
                </div>
            </div>
        </div>

        <!-- Table Box -->
        <div class="deals-tablebox">
            <div class="table-wrapper">
                <div class="table-container">
                    <table class="deals-table">
                        <thead>
                            <tr>
                                <th>DEAL TITLE</th>
                                <th>COMPANY</th>
                                <th>VALUE</th>
                                <th>STAGE</th>
                                <th>CLOSE DATE</th>
                                <th>PRIORITY</th>
                                <th>OWNER</th>
                                <th>ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="dealsTableBody">
                            <!-- Table content will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="empty-state" id="emptyState" style="display: none;">
                <div class="empty-content">
                    <i class="fas fa-handshake empty-icon"></i>
                    <h3>No deals found</h3>
                    <p>Start by creating your first deal to get started</p>
                    <button class="btn-primary" onclick="AddDeals()">
                        <i class="fas fa-plus"></i> Create Deal
                    </button>
                </div>
            </div>
        </div>

        <!-- Pagination Box -->
        <div class="deals-paginationbox">
            <div class="pagination-container">
                <div class="pagination-info-bottom">
                    <span id="recordCountBottom">Showing 0-0 of 0 records</span>
                </div>
                <div class="pagination-buttons">
                    <button class="pagination-btn" id="firstBtn" onclick="goToPage(1)" disabled>«</button>
                    <button class="pagination-btn" id="prevBtnBottom" onclick="previousPage()" disabled>‹</button>
                    <div class="page-numbers" id="pageNumbers"></div>
                    <button class="pagination-btn" id="nextBtnBottom" onclick="nextPage()" disabled>›</button>
                    <button class="pagination-btn" id="lastBtn" onclick="goToLastPage()" disabled>»</button>
                </div>
            </div>
        </div>

    </div>
</div>
<script src="deal.js"></script>
</body>
</html>
